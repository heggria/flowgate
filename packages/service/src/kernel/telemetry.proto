// Wire-compatible telemetry and explicit URL-test subset of SagerNet/sing-box v1.14.0 daemon/started_service.proto.
// Upstream source: https://github.com/SagerNet/sing-box/blob/v1.14.0/daemon/started_service.proto
syntax = "proto3";
package daemon;
service StartedService {
 rpc URLTest(URLTestRequest) returns(Empty) {}
 rpc SubscribeOutbounds(Empty) returns(stream OutboundList) {}
 rpc SubscribeStatus(SubscribeStatusRequest) returns(stream Status) {}
 rpc SubscribeConnections(SubscribeConnectionsRequest) returns(stream ConnectionEvents) {}
}
message SubscribeStatusRequest { int64 interval=1; }
message SubscribeConnectionsRequest { int64 interval=1; }
message Status { uint64 memory=1;int32 goroutines=2;int32 connectionsIn=3;int32 connectionsOut=4;bool trafficAvailable=5;int64 uplink=6;int64 downlink=7;int64 uplinkTotal=8;int64 downlinkTotal=9; }
message ConnectionEvents { repeated ConnectionEvent events=1;bool reset=2; }
message ConnectionEvent { int32 type=1;string id=2;Connection connection=3;int64 uplinkDelta=4;int64 downlinkDelta=5;int64 closedAt=6; }
message Connection {string id=1;string inbound=2;string inboundType=3;int32 ipVersion=4;string network=5;string source=6;string destination=7;string domain=8;string protocol=9;string user=10;string fromOutbound=11;int64 createdAt=12;int64 closedAt=13;int64 uplink=14;int64 downlink=15;int64 uplinkTotal=16;int64 downlinkTotal=17;string rule=18;string outbound=19;string outboundType=20;repeated string chainList=21;}

message Empty {}
message URLTestRequest { string outboundTag=1; }
message GroupItem { string tag=1;string type=2;int64 urlTestTime=3;int32 urlTestDelay=4; }
message OutboundList { repeated GroupItem outbounds=1; }
